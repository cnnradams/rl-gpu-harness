schema_version = "1.4"
artifacts = ["/workspace/report.json"]

[agent]
timeout_sec = 180

[environment]
cpus = 1
memory_mb = 512
gpus = 0
workdir = "/workspace"

[verifier]
timeout_sec = 60
environment_mode = "separate"

[verifier.environment]
docker_image = "python:3.12-slim"
cpus = 1
memory_mb = 512
gpus = 0
workdir = "/tests"
