[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-gpu-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["modal==1.6.3", "fastapi>=0.115,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
harbor = ["harbor[modal]==0.23.0"]

[project.scripts]
gpu = "gpu_harness.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_harness"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/gpu_harness/service.py" = ["B008"]
